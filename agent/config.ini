[server]
; Адрес сервера. Для ноутбука 2 переопределяется через env var EDR_SERVER в ЗАПУСТИТЬ_АГЕНТ.bat
host     = 127.0.0.1
port     = 8088
base_url = http://127.0.0.1:8088
url      = http://127.0.0.1:8088

[agent]
; Имя агента. Для ноутбука 2 переопределяется через env var AGENT_ID в ЗАПУСТИТЬ_АГЕНТ.bat
; Пустое значение = hostname компьютера автоматически
agent_id    =
id          =
; Пустое значение = Desktop, Documents, Downloads текущего пользователя
watch_paths =

[protection]
enabled              = true
password             = school2024
max_attempts         = 3
block_mail           = false
monitor_clipboard    = true
; Минимальная уверенность для срабатывания (0.0–1.0)
min_confidence       = 0.15
; Минимальная уверенность для изображений (OCR даёт больше ложных срабатываний)
min_confidence_image = 0.40
