[server]
host     = 127.0.0.1
port     = 8088
base_url = http://127.0.0.1:8088
; alias used by file_open_handler.py
url      = http://127.0.0.1:8088

[agent]
; Override with env var AGENT_ID if needed
agent_id    =
; alias used by file_open_handler.py
id          =
; Watched paths (comma-separated; empty = Desktop, Documents, Downloads)
watch_paths = C:\Users\dinar\Desktop,C:\Users\dinar\Documents,C:\Users\dinar\Downloads

[protection]
; File-open interception (registry_handler)
enabled      = true
password     = school2024
max_attempts = 3
; Block outbound mail via Windows Firewall on start
block_mail       = false
; Monitor clipboard for PII
monitor_clipboard = true
